version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: orderflow-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orderflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-orderflow_prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - orderflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderflow_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orderflow-api-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-orderflow_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:-orderflow_prod}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a long random value}
      # Encrypts stored staff passwords. Must differ from JWT_SECRET (the API refuses to start otherwise).
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?CREDENTIAL_ENCRYPTION_KEY must be set to a long random value, different from JWT_SECRET}
      CREDENTIAL_ENCRYPTION_KEY_PREVIOUS: ${CREDENTIAL_ENCRYPTION_KEY_PREVIOUS:-}
      # Public key that OTA update uploads must be signed with (see docs/deployment.md, "Signed OTA updates").
      OTA_PUBLIC_KEY: ${OTA_PUBLIC_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-https://your-domain.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      EMAIL_PROXY_URL: ${EMAIL_PROXY_URL:-}
      EMAIL_PROXY_SECRET: ${EMAIL_PROXY_SECRET:-}
      # WhatsApp gateway (Evolution API). The key must match the gateway's
      # AUTHENTICATION_API_KEY; the webhook secret is appended to the webhook
      # URL so forged inbound messages are rejected.
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:?EVOLUTION_API_KEY must be set}
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL:-}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:?WHATSAPP_WEBHOOK_SECRET must be set to a long random value}
      # Number of reverse proxies in front of the API (Nginx = 1). See main.ts.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      # Google sign-in rejects tokens not issued to this client (auth.service.ts googleAuth).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-17124156249-tmi744b2qhi0leamcjjj8in2ti3ktd0d.apps.googleusercontent.com}
    # Published on the loopback interface only: the Apache/Nginx reverse proxy on this
    # host is the single public entry point. Docker publishes ports straight through
    # the host firewall (ufw/iptables rules do not apply), so a bare "3001:3001" would
    # expose the API, unproxied and without TLS, to the internet. Set BIND_ADDRESS only
    # if the proxy runs on another machine.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - orderflow-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://obix360.com}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-17124156249-tmi744b2qhi0leamcjjj8in2ti3ktd0d.apps.googleusercontent.com}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    container_name: orderflow-web-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://your-domain.com/api}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on:
      - api
    networks:
      - orderflow-net

networks:
  orderflow-net:
    driver: bridge

volumes:
  postgres_data:
