version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: orderflow-postgres
    environment:
      POSTGRES_USER: orderflow_user
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: orderflow_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - orderflow-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orderflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - orderflow-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  orderflow-net:
    driver: bridge
