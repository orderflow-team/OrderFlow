name: Release AAB (Play Store)

# Builds a signed Android App Bundle (.aab) for Google Play submission — the
# `playstore` flavor, which has NEXT_PUBLIC_DISTRIBUTION_CHANNEL=playstore
# baked in (disables the native APK self-updater in use-native-app-update.ts)
# and strips the REQUEST_INSTALL_PACKAGES permission via its manifest
# overlay (app/src/playstore/AndroidManifest.xml). Google Play explicitly
# prohibits apps from self-updating outside the Play Store using that
# permission — see apps/web/android/app/build.gradle's productFlavors
# comment for the full reasoning.
#
# This workflow does NOT publish to Play Console — there's no Google Play
# Developer API service account configured in this project. It builds the
# signed .aab and uploads it as a workflow artifact; download it from the
# run and upload it to Play Console manually (or wire up
# r0adkll/upload-google-play or fastlane here later if this becomes routine).
#
# Required GitHub secrets (same signing key as release-apk.yml — Play App
# Signing re-signs the .aab you upload with its own key, so the upload key
# here doesn't need to match what's already on users' devices from the
# direct-distribution APK):
#   NEXT_PUBLIC_API_URL  — production API base URL (e.g. https://orderflow-1.onrender.com)
#   KEYSTORE_BASE64      — base64-encoded release keystore file
#                          (base64 -w 0 your-release.jks)
#   KEYSTORE_PASSWORD    — storePassword from keystore.properties
#   KEY_ALIAS            — keyAlias from keystore.properties
#   KEY_PASSWORD         — keyPassword from keystore.properties
#
# Before running: bump versionCode and versionName in
#   apps/web/android/app/build.gradle

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name — must match versionName in build.gradle (e.g. 1.16)'
        required: true
        type: string

jobs:
  release:
    name: Build signed AAB for Play Store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build Capacitor web export
        working-directory: apps/web
        env:
          CAPACITOR_BUILD: '1'
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_DISTRIBUTION_CHANNEL: playstore
        run: npm run build:capacitor

      - name: Sync Capacitor to Android
        working-directory: apps/web
        run: npx cap sync android

      - name: Write keystore file
        working-directory: apps/web/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing in GitHub Repository Secrets!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > release.jks

      - name: Write keystore.properties
        working-directory: apps/web/android
        run: |
          cat > keystore.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Build release AAB (playstore flavor)
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew bundlePlaystoreRelease --no-daemon

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: obix-${{ inputs.version_name }}-playstore.aab
          path: apps/web/android/app/build/outputs/bundle/playstoreRelease/app-playstore-release.aab
          retention-days: 30
