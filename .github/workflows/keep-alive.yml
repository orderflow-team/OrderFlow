name: API health check

# Calls the production health endpoint every 10 minutes. `/api/health` runs a
# real `SELECT 1` against the database, so a failure means the API process or
# the database is down or unreachable, and the run goes red (GitHub notifies
# the people watching this repository). It also keeps a serverless database
# (for example Neon's free tier, which autosuspends after ~5 minutes idle)
# from going cold.
#
# The path is `/api/health`, not `/health`: the Apache reverse proxy only
# forwards `/api/*` and `/auth/*` to the API, so a bare `/health` would land
# on the web app and 404.
#
# (File name kept as keep-alive.yml so existing links to this workflow still
# work. It used to ping an old Render deployment that no longer exists.)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check API and database health
        run: |
          url="https://obix360.com/api/health"
          # --retry covers a one-off network blip so it does not page anyone.
          status=$(curl -s -o body.json -w "%{http_code}" --max-time 30 --retry 2 --retry-delay 10 "$url")
          echo "Health check returned: $status"
          cat body.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Health check failed with status $status ($url)"
            exit 1
          fi
          if ! grep -q '"status":"ok"' body.json; then
            echo "::error::Health endpoint answered 200 but not status ok"
            exit 1
          fi
