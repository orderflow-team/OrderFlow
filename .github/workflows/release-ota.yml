name: Release OTA Bundle

# Builds the Next.js Capacitor export and publishes it as a new OTA release.
# Installed apps poll /api/app-updates/latest on launch and download the bundle
# in the background — users get the update on their next app restart.
#
# Required GitHub repository variable:
#   OTA_PUBLIC_KEY       — public half of the OTA signing key (also built into the apps)
#
# Required GitHub secrets:
#   NEXT_PUBLIC_API_URL  — production API base URL (e.g. https://orderflow-1.onrender.com)
#   OTA_SIGNING_PRIVATE_KEY — private half of the OTA signing key (see apps/web/scripts/ota-keygen.mjs)
#   ADMIN_TOKEN          — access JWT for a super_admin or admin user on that API.
#                          Access tokens last 1 hour: update this secret right before dispatching.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version (e.g. 1.16, 2026.08.25)'
        required: true
        type: string
      min_native_version:
        description: 'Minimum native APK version required (e.g. 1.15) — leave blank to allow any'
        required: false
        type: string
      platform:
        description: >-
          Release channel — "android" (default) is the shared bucket every
          Android install falls back to; only choose "android-playstore" when
          this release must specifically NOT re-enable the direct flavor's
          native-updater JS on Play Store installs (see
          app-updates.service.ts's getLatest and use-native-app-update.ts).
        required: false
        type: choice
        options:
          - android
          - android-playstore
        default: android

permissions:
  contents: read

jobs:
  release:
    name: Build & publish OTA bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Require the OTA public key
        env:
          OTA_PUBLIC_KEY: ${{ vars.OTA_PUBLIC_KEY }}
        run: |
          if [ -z "$OTA_PUBLIC_KEY" ]; then
            echo "::error::Repository variable OTA_PUBLIC_KEY is not set. Without it this build would accept unsigned OTA updates. Generate a key with apps/web/scripts/ota-keygen.mjs."
            exit 1
          fi

      - name: Build Capacitor export
        working-directory: apps/web
        env:
          CAPACITOR_BUILD: '1'
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_OTA_PUBLIC_KEY: ${{ vars.OTA_PUBLIC_KEY }}
          # The shared "android" bucket also reaches Play Store installs, so it
          # is built with no channel: the in-app APK updater is opt-in to
          # 'direct' (use-native-app-update.ts) and must never prompt a Play
          # install to self-update.
          NEXT_PUBLIC_DISTRIBUTION_CHANNEL: ${{ inputs.platform == 'android-playstore' && 'playstore' || '' }}
          # Public OAuth client ID (not a secret). Without it Google sign-in
          # falls back to an invalid client, as Play Store 1.18 shipped.
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 17124156249-tmi744b2qhi0leamcjjj8in2ti3ktd0d.apps.googleusercontent.com
        run: npm run build:capacitor

      - name: Publish OTA bundle
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          # Offline signing key (apps/web/scripts/ota-keygen.mjs). Installed apps only apply bundles it signed.
          OTA_SIGNING_PRIVATE_KEY: ${{ secrets.OTA_SIGNING_PRIVATE_KEY }}
          # Via the environment, not pasted into the script text (see release-apk.yml).
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_MIN_NATIVE_VERSION: ${{ inputs.min_native_version }}
          INPUT_PLATFORM: ${{ inputs.platform }}
        run: |
          node scripts/release-ota.mjs "$INPUT_VERSION" "$INPUT_MIN_NATIVE_VERSION" "$INPUT_PLATFORM"
